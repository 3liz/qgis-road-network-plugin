site_name: RoadNetwork plugin
site_author: 3Liz
site_description: RoadNetwork plugin
site_url: https://docs.3liz.org/qgis-road-network-plugin/
repo_url: https://github.com/3liz/qgis-road-network-plugin/
copyright: '<span class="copyleft">&copy;</span> 3Liz'

docs_dir: docs
site_dir: build

nav:
    - docs.3liz.org: '../'
    - Home: index.md
    - Concepts: concepts/index.md
    - Installation: installation/index.md
    - User Guide:
      - Introduction: user-guide/index.md
      - Import data: user-guide/import.md
      - QGIS project and tools: user-guide/qgis-project.md
      - Processing algorithms: user-guide/processing.md
      - Road graph editing: user-guide/graph-editing.md
      - Check and fix the road graph: user-guide/graph-checks.md
      - Managed objects: user-guide/managed-objects.md
    - Changelog: changelog.md
    - Contribution: contributing.md
    - Database:
      - Useful functions: database-guide/functions.md
      - Tables and fields: database-guide/tables.md
      - Database structure: database-guide/structure.md
    - Lizmap Web Client: lizmap-web-client/index.md
    - Appendix:
      - Training plan (French): appendix/training-plan.md

plugins:
  - search
  # - git-revision-date-localized
  # Translated pages: page.fr.md next to page.md, downloaded from Transifex (see docs_tools/transifex_docs.py)
  # The pages which are not translated are displayed in English
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Concepts: Concepts
            Installation: Installation
            User Guide: Guide utilisateur
            Introduction: Introduction
            Import data: Importer les données
            QGIS project and tools: Projet QGIS et outils
            Processing algorithms: Algorithmes de traitement
            Road graph editing: Édition du graphe routier
            Check and fix the road graph: Vérifier et corriger le graphe routier
            Managed objects: Objets gérés
            Changelog: Journal des modifications
            Contribution: Contribuer
            Database: Base de données
            Useful functions: Fonctions utiles
            Tables and fields: Tables et champs
            Database structure: Structure de la base de données
            Appendix: Annexes
            Training plan (French): Plan de formation

# Keep the anchors of the English headings in the translated pages
hooks:
  - docs_tools/i18n_anchors.py

markdown_extensions:
  - toc:
      permalink: "#"
  - meta:
  - pymdownx.highlight:
      linenums: true
      linenums_style: pymdownx.inline
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
  - pymdownx.magiclink:
  - pymdownx.tasklist:
  - pymdownx.snippets:
  - pymdownx.keys:
  - attr_list:
  - admonition:
  - pymdownx.details:

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.1.1/highlight.min.js
  - https://unpkg.com/mermaid@8.6.4/dist/mermaid.min.js
extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.1.1/styles/default.min.css

theme:
  name: material
  font: false
  icon:
    repo: fontawesome/brands/github-alt
  language: 'en'
  logo: icon.png
  favicon: icon.png
  palette:
    accent: deep-orange
    primary: green
    scheme: default
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top

extra:
  social:
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/3LIZ_news

    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/3liz

    - icon: fontawesome/brands/github
      link: https://github.com/3liz/

    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/u/3liz

    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCYYW2CTWR_84kB6pt2zCWbQ

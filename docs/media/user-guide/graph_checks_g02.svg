<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="250" fill="#ffffff"/>
  <line x1="450.0" y1="12" x2="450.0" y2="238" stroke="#e0e0e0" stroke-width="2"/>
  <text x="225.0" y="28" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">Issue</text>
  <polyline points="40.0,150 410.0,150" fill="none" stroke="#9e9e9e" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="225.0,60 225.0,128" fill="none" stroke="#78909c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="225.0,128 225.0,150" fill="none" stroke="#e53935" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5,4"/>
  <circle cx="225.0" cy="128" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <circle cx="40.0" cy="150" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <circle cx="410.0" cy="150" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <circle cx="225.0" cy="60" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <text x="225.0" y="200" font-size="12.5" fill="#212121" text-anchor="middle" font-weight="normal">the road stops less than 2 m before the other road</text>
  <text x="225.0" y="218" font-size="12.5" fill="#212121" text-anchor="middle" font-weight="normal">(T junction), without being connected to it</text>
  <text x="675.0" y="28" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">extend_edge</text>
  <polyline points="490.0,150 675.0,150" fill="none" stroke="#1565c0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="675.0,150 860.0,150" fill="none" stroke="#1565c0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="675.0,60 675.0,150" fill="none" stroke="#1565c0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="675.0" cy="150" r="8" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <circle cx="490.0" cy="150" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <circle cx="860.0" cy="150" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <circle cx="675.0" cy="60" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <text x="675.0" y="200" font-size="12.5" fill="#212121" text-anchor="middle" font-weight="normal">the edge is extended to the other road,</text>
  <text x="675.0" y="218" font-size="12.5" fill="#212121" text-anchor="middle" font-weight="normal">which is split by the node</text>

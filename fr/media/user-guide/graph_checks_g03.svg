  <circle cx="665.0" cy="140" r="8" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="675.0" y="200" font-size="12.5" fill="#212121" text-anchor="middle" font-weight="normal">les tronçons de l'autre nœud sont déplacés sur le nœud</text>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="250" fill="#ffffff"/>
  <line x1="450.0" y1="12" x2="450.0" y2="238" stroke="#e0e0e0" stroke-width="2"/>
  <text x="225.0" y="28" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">Issue</text>
  <polyline points="40.0,140 215.0,140" fill="none" stroke="#9e9e9e" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="232.0,152 410.0,152" fill="none" stroke="#78909c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="232.0,152 232.0,60" fill="none" stroke="#78909c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="40.0" cy="140" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <circle cx="410.0" cy="152" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <circle cx="232.0" cy="60" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <circle cx="215.0" cy="140" r="6" fill="#ffffff" stroke="#e53935" stroke-width="2"/>
  <circle cx="232.0" cy="152" r="6" fill="#e53935" stroke="#e53935" stroke-width="2"/>
  <text x="225.0" y="200" font-size="12.5" fill="#212121" text-anchor="middle" font-weight="normal">two nodes less than 1 m from each other:</text>
  <text x="225.0" y="218" font-size="12.5" fill="#212121" text-anchor="middle" font-weight="normal">the roads are not connected</text>
  <text x="675.0" y="28" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">merge_nodes</text>
  <polyline points="490.0,140 665.0,140" fill="none" stroke="#9e9e9e" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="665.0,140 860.0,152" fill="none" stroke="#1565c0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="665.0,140 682.0,60" fill="none" stroke="#1565c0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="490.0" cy="140" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <circle cx="860.0" cy="152" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <circle cx="682.0" cy="60" r="6" fill="#ffffff" stroke="#424242" stroke-width="2"/>
  <circle cx="665.0" cy="140" r="8" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="675.0" y="200" font-size="12.5" fill="#212121" text-anchor="middle" font-weight="normal">the edges of the other node are moved to the node</text>
  <text x="675.0" y="218" font-size="12.5" fill="#212121" text-anchor="middle" font-weight="normal">with the most edges, then the other node is deleted</text>
</svg>

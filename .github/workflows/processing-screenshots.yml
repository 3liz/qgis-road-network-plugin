name: Processing screenshots 📸

on:
  push:
    branches:
      - main
    paths:
      - 'roadnetwork/processing/**'
      - '.docker/processing_screenshots.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    if: github.repository_owner == '3liz'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create the screenshots of the Processing algorithms
        run: make processing-screenshots

      - name: Create a pull request with the updated screenshots
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: docs/media/installation/*.png
          branch: bot/processing-screenshots
          delete-branch: true
          commit-message: "Documentation - Update the screenshots of the Processing algorithms"
          title: "Documentation - Update the screenshots of the Processing algorithms"
          body: |
            The Processing algorithms have been modified: this pull request updates their screenshots
            used in the documentation.

            Generated by the workflow `processing-screenshots.yml` with `make processing-screenshots`.

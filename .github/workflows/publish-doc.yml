name: 📖 Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'roadnetwork/install/sql/**'
  # Get the new translations of the documentation from Transifex every week
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

    - name: Get source code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v2.2.2
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: |
          requirements/doc.txt
          requirements/transifex.txt

    - name: Set up NodeJS (for search index prebuilding)
      uses: actions/setup-node@v2.5.1
      with:
        node-version: '16'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -r requirements/doc.txt
        python -m pip install -r requirements/transifex.txt

    # The database documentation is not versioned (docs/database is in .gitignore):
    # it is generated by SchemaSpy from a database installed with the SQL files in roadnetwork/install/sql
    - name: Generate the database documentation with SchemaSpy
      run: make schemaspy

    - name: Copy CHANGELOG.md and CONTRIBUTING.md
      run: |
        cp CHANGELOG.md docs/
        cp CONTRIBUTING.md docs/

    # Translated pages (page.fr.md next to page.md), not versioned
    - name: Download the translations of the documentation from Transifex
      run: python docs_tools/transifex_docs.py pull
      env:
        TRANSIFEX_TOKEN: ${{ secrets.TRANSIFEX_TOKEN }}

    - name: Deploy to Github Pages
      run: |
        git config --global user.name "${{ secrets.BOT_NAME }}"
        git config --global user.email "${{ secrets.BOT_MAIL }}"
        mkdocs gh-deploy --clean --force --verbose
